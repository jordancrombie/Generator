<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="CH2 sees what was sent; CH1 sees what the TBC made of it" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .edge { stroke: #8c959f; }
    .edge-fill { fill: #8c959f; }
    .accent { stroke: #0969da; }
    .accent-fill { fill: #0969da; fill-opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .edge { stroke: #6e7681; }
      .edge-fill { fill: #6e7681; }
      .accent { stroke: #4493f8; }
      .accent-fill { fill: #4493f8; fill-opacity: 0.18; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="edge-fill"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="400"/>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">CH2 sees what was sent; CH1 sees what the TBC made of it</text>

  <g fill="none" stroke-width="1.25" class="edge">
    <path d="M168 104H230" marker-end="url(#arrow)"/>
    <path d="M200 104V206" marker-end="url(#arrow)"/>
    <path d="M376 104H398" marker-end="url(#arrow)"/>
    <path d="M520 104H542" marker-end="url(#arrow)"/>
    <path d="M616 132V206" marker-end="url(#arrow)"/>
    <path d="M416 276V314" marker-end="url(#arrow)"/>
    <path d="M96 132V344H304" marker-end="url(#arrow)"/>
  </g>
  <circle cx="200" cy="104" r="4" class="edge-fill"/>
  <text x="200" y="66" text-anchor="middle" font-size="11.5" class="quiet">75 Ω series</text>
  <text x="208" y="160" font-size="11.5" class="quiet">tee</text>

  <rect x="24" y="76" width="144" height="56" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="96" y="100" text-anchor="middle" font-weight="600" class="ink">ESP32 generator</text>
  <text x="96" y="118" text-anchor="middle" font-size="11.5" class="quiet">GPIO25 DAC</text>

  <rect x="232" y="76" width="144" height="56" rx="8" stroke-width="2" class="accent accent-fill"/>
  <text x="304" y="100" text-anchor="middle" font-weight="600" class="ink">TBC under test</text>
  <text x="304" y="118" text-anchor="middle" font-size="11.5" class="quiet">re-times the signal</text>

  <rect x="400" y="76" width="120" height="56" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="460" y="100" text-anchor="middle" font-weight="600" class="ink">Monitor</text>
  <text x="460" y="118" text-anchor="middle" font-size="11.5" class="quiet">loop-through</text>

  <rect x="544" y="76" width="144" height="56" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="616" y="100" text-anchor="middle" font-weight="600" class="ink">Vectorscope</text>
  <text x="616" y="118" text-anchor="middle" font-size="11.5" class="quiet">loop-through</text>

  <rect x="120" y="176" width="584" height="100" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="4 4" class="edge"/>
  <text x="416" y="198" text-anchor="middle" font-weight="600" class="ink">ADP2230</text>

  <rect x="136" y="208" width="128" height="56" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="200" y="232" text-anchor="middle" font-weight="600" class="ink">CH2 reference</text>
  <text x="200" y="250" text-anchor="middle" font-size="11.5" class="quiet">what was sent</text>

  <rect x="552" y="208" width="128" height="56" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="616" y="232" text-anchor="middle" font-weight="600" class="ink">CH1 result</text>
  <text x="616" y="250" text-anchor="middle" font-size="11.5" class="quiet">75 Ω terminated</text>

  <text x="426" y="300" font-size="11.5" class="quiet">CH1 + CH2 capture</text>
  <text x="200" y="336" text-anchor="middle" font-size="11.5" class="quiet">manifest over USB</text>

  <rect x="306" y="316" width="220" height="56" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="416" y="340" text-anchor="middle" font-weight="600" class="ink">Grader</text>
  <text x="416" y="358" text-anchor="middle" font-size="11.5" class="quiet">scores CH1 against the ideal</text>
</svg>
